<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Demo Expired</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #f2f2f2;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a3a9b7;
    border: 1px solid #2a2e38;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px;
    line-height: 1.3;
    margin: 0 0 16px;
    font-weight: 600;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #c2c6d0;
    margin: 0 0 32px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #0f1115;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 8px;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="badge">Demo Expired</span>
      <h1>This preview is no longer available</h1>
      <p>This demo page has expired. To move forward with the project, fill out the form below and our team will get started right away.</p>
      <a class="btn" href="https://www.fortxweb.com/onboarding-us" target="_blank" rel="noopener">Continue the Project</a>
    </div>
  </div>
</body>
</html>
